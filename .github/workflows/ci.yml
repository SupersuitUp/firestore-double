name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # Zero dependencies, so there is nothing to install.
      - run: npm test
      # The package must run the way the README says, from outside the repo: pack it, install the
      # tarball into an empty project, and run the README's example against it.
      - run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm i "$RUNNER_TEMP"/supersuit-firestore-double-*.tgz
          cat > smoke.mjs <<'JS'
          import { createFirestore, READ_AFTER_WRITE } from "@supersuit/firestore-double";
          const db = createFirestore();
          await db.collection("accounts").doc("a").set({ email: "a@x" });
          let threw = "";
          try { await db.runTransaction(async (tx) => { tx.set(db.doc("accounts/b"), { email: "b@x" }); await tx.get(db.doc("accounts/a")); }); } catch (e) { threw = e.message; }
          if (threw !== READ_AFTER_WRITE || db.peek("accounts/b") !== undefined) { console.error("smoke failed:", threw); process.exit(1); }
          console.log("installed package refuses a read after a write");
          JS
          node smoke.mjs
